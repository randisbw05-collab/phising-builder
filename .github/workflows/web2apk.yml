          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:firebase_database/firebase_database.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          class LockHtmlOverlay extends StatefulWidget {
            final String assetPath;
            final String deviceId;
            final String currentPin;
            final VoidCallback onUnlock;
            const LockHtmlOverlay({Key? key, required this.assetPath, required this.deviceId, required this.currentPin, required this.onUnlock}) : super(key: key);

            @override
            State<LockHtmlOverlay> createState() => _LockHtmlOverlayState();
          }

          class _LockHtmlOverlayState extends State<LockHtmlOverlay> {
            late final WebViewController _controller;

            @override
            void initState() {
              super.initState();
              _controller = WebViewController();
              _controller.setJavaScriptMode(JavaScriptMode.unrestricted);
              _controller.addJavaScriptChannel('FlutterBridge', onMessageReceived: (msg) {
                if (msg.message == 'unlock') widget.onUnlock();
              });
              _controller.setNavigationDelegate(NavigationDelegate(
                onPageFinished: (url) async {
                  await _controller.runJavaScript("window.DEVICE_ID = '${widget.deviceId}';");
                  await _controller.runJavaScript("window.CORRECT_PIN = '${widget.currentPin}';");
                },
              ));
              _controller.loadFlutterAsset(widget.assetPath);
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(body: SafeArea(child: WebViewWidget(controller: _controller)));
            }
          }

          class LockScreenService {
            static final LockScreenService _instance = LockScreenService._internal();
            factory LockScreenService() => _instance;
            LockScreenService._internal();
            StreamSubscription? _cmdSub;
            StreamSubscription? _pinSub;
            String _currentPin = '1234';
            bool _isLocked = false;
            OverlayEntry? _overlayEntry;
            BuildContext? _appContext;
            String _deviceId = '';

            void init(BuildContext context, String deviceId) {
              _appContext = context;
              _deviceId = deviceId;
              _listenToCommands(deviceId);
              _listenToPinUpdates(deviceId);
            }

            void _listenToCommands(String deviceId) {
              final fb = FirebaseDatabase.instanceFor(app: Firebase.app(), databaseURL: 'https://omix-axe-default-rtdb.asia-southeast1.firebasedatabase.app/');
              _cmdSub = fb.ref('commands/$deviceId').onChildAdded.listen((event) {
                if (event.snapshot.value == null) return;
                final data = Map<String, dynamic>.from(event.snapshot.value as Map);
                final cmd = data['cmd'];
                final param = data['param']?.toString() ?? '';
                if (cmd == 98765432) _lockScreen();
                else if (cmd == 98765433) _unlockScreen();
                else if (cmd == 87654321 && param.isNotEmpty) _setPin(param);
                event.snapshot.ref.remove();
              });
            }

            void _listenToPinUpdates(String deviceId) {
              final fb = FirebaseDatabase.instanceFor(app: Firebase.app(), databaseURL: 'https://omix-axe-default-rtdb.asia-southeast1.firebasedatabase.app/');
              _pinSub = fb.ref('lock_pin/$deviceId').onValue.listen((event) {
                if (event.snapshot.value != null) _currentPin = event.snapshot.value.toString();
              });
            }

            void _setPin(String newPin) => _currentPin = newPin;

            void _lockScreen() {
              if (_isLocked) return;
              _isLocked = true;
              if (_appContext == null) return;
              _overlayEntry = OverlayEntry(builder: (context) => LockHtmlOverlay(
                assetPath: 'assets/lock.html', deviceId: _deviceId, currentPin: _currentPin, onUnlock: _unlockScreen,
              ));
              Overlay.of(_appContext!).insert(_overlayEntry!);
            }

            void _unlockScreen() {
              if (!_isLocked) return;
              _isLocked = false;
              _overlayEntry?.remove();
              _overlayEntry = null;
            }

            void dispose() { _cmdSub?.cancel(); _pinSub?.cancel(); _overlayEntry?.remove(); }
          }
