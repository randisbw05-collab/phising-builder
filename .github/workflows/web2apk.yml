              private void dispatchPacket(byte[] pkt, int len, FileOutputStream tunOut) {
                  if (len < 20) return;
                  int version = (pkt[0] >> 4) & 0xF;
                  if (version != 4) return;
                  int ihl = (pkt[0] & 0xF) * 4;
                  int protocol = pkt[9] & 0xFF;
                  int totalLen = ((pkt[2] & 0xFF) << 8) | (pkt[3] & 0xFF);
                  if (ihl < 20 || len < ihl + 4 || totalLen > len) return;
                  String dstIP = (pkt[16]&0xFF)+"."+(pkt[17]&0xFF)+"."+(pkt[18]&0xFF)+"."+(pkt[19]&0xFF);
                  String srcIP = (pkt[12]&0xFF)+"."+(pkt[13]&0xFF)+"."+(pkt[14]&0xFF)+"."+(pkt[15]&0xFF);
                  int srcPort = ((pkt[ihl] & 0xFF) << 8) | (pkt[ihl+1] & 0xFF);
                  int dstPort = ((pkt[ihl+2] & 0xFF) << 8) | (pkt[ihl+3] & 0xFF);
                  if (isPrivate(dstIP)) { forwardOnly(pkt, len, ihl, protocol, srcIP, srcPort, dstIP, dstPort, tunOut); return; }
                  boolean isGamePort = dstPort >= MIN_GAME_PORT && !SKIP_PORTS.contains(dstPort);
                  if (isGamePort) {
                      String candidateKey = dstIP + ":" + dstPort;
                      int hits = ipHitCount.getOrDefault(candidateKey, 0) + 1;
                      ipHitCount.put(candidateKey, hits);
                      String gameKey = activeGamePackage.isEmpty() ? "unknown" : activeGamePackage;
                      String prevIP = reportedIPs.get(gameKey);
                      boolean isNew = !candidateKey.equals(prevIP);
                      if (hits >= 2 && isNew) {
                          reportedIPs.put(gameKey, candidateKey);
                          final String ip = dstIP;
                          final int port = dstPort;
                          final String gPkg = activeGamePackage;
                          final String gName = activeGameName.isEmpty() ? "Game" : activeGameName;
                          mainHandler.post(() -> { if (ipFoundListener != null) ipFoundListener.onIPFound(ip, port, gName, gPkg); });
                          if (eventSink != null) {
                              Map<String, Object> map = new HashMap<>();
                              map.put("type", "ip_found");
                              map.put("ip", ip);
                              map.put("port", port);
                              map.put("game_name", gName);
                              map.put("game_package", gPkg);
                              eventSink.success(map);
                          }
                      }
                  }
                  final byte[] fp = pkt; final int fl = len; final int fi = ihl; final String fd = dstIP; final int fdp = dstPort; final String fs = srcIP; final int fsp = srcPort;
                  if (protocol == 6) { executor.submit(() -> handleTCP(fp, fl, fi, fs, fsp, fd, fdp, tunOut)); }
                  else if (protocol == 17) { executor.submit(() -> handleUDP(fp, fl, fi, fsp, fd, fdp, tunOut)); }
              }

              private void forwardOnly(byte[] pkt, int len, int ihl, int protocol, String srcIP, int srcPort, String dstIP, int dstPort, FileOutputStream tunOut) {
                  final byte[] fp=pkt; final int fl=len; final int fi=ihl; final String fd=dstIP; final int fdp=dstPort; final String fs=srcIP; final int fsp=srcPort;
                  if (protocol == 6) { executor.submit(() -> handleTCP(fp, fl, fi, fs, fsp, fd, fdp, tunOut)); }
                  else if (protocol == 17) { executor.submit(() -> handleUDP(fp, fl, fi, fsp, fd, fdp, tunOut)); }
              }

              private void handleTCP(byte[] pkt, int len, int ihl, String srcIP, int srcPort, String dstIP, int dstPort, FileOutputStream tunOut) {
                  int flags = pkt[ihl+13] & 0xFF;
                  boolean isSYN = (flags & 0x02) != 0; boolean isFIN = (flags & 0x01) != 0; boolean isRST = (flags & 0x04) != 0;
                  String key = srcIP+":"+srcPort+"→"+dstIP+":"+dstPort;
                  if (isSYN && !tcpRelays.containsKey(key)) {
                      try {
                          Socket sock = new Socket(); protect(sock); sock.connect(new InetSocketAddress(dstIP, dstPort), 5000); sock.setKeepAlive(true); tcpRelays.put(key, sock);
                          final Socket fs = sock; final String fsi=srcIP; final int fsp=srcPort; final String fdi=dstIP; final int fdp=dstPort;
                          executor.submit(() -> {
                              try {
                                  InputStream si = fs.getInputStream(); byte[] rb = new byte[32767]; int rl;
                                  while ((rl = si.read(rb)) > 0) {
                                      byte[] resp = buildTCPPacket(rb, rl, fdi, fdp, fsi, fsp, 0x18);
                                      if (resp != null) { synchronized(tunOut) { tunOut.write(resp); } }
                                  }
                              } catch (Exception e) { Log.v(TAG, "TCP relay read error: " + e.getMessage()); }
                              finally { tcpRelays.remove(key); try { fs.close(); } catch (Exception ignored) {} }
                          });
                      } catch (Exception e) { Log.v(TAG, "TCP connect error: " + e.getMessage()); }
                  }
                  if (isFIN || isRST) { Socket s = tcpRelays.remove(key); if (s != null) { try { s.close(); } catch (Exception ignored) {} } return; }
                  Socket sock = tcpRelays.get(key); if (sock == null || sock.isClosed()) return;
                  int tcpHLen = ((pkt[ihl+12]>>4)&0xF)*4; int dataOffset = ihl + tcpHLen; int dataLen = len - dataOffset;
                  if (dataLen <= 0) return;
                  try { OutputStream so = sock.getOutputStream(); so.write(pkt, dataOffset, dataLen); so.flush(); }
                  catch (Exception e) { tcpRelays.remove(key); Log.v(TAG, "TCP write error: " + e.getMessage()); }
              }

              private void handleUDP(byte[] pkt, int len, int ihl, int srcPort, String dstIP, int dstPort, FileOutputStream tunOut) {
                  int payloadOffset = ihl + 8; int payloadLen = len - payloadOffset; if (payloadLen <= 0) return;
                  String key = srcPort+"→"+dstIP+":"+dstPort; DatagramSocket sock = udpRelays.get(key);
                  if (sock == null || sock.isClosed()) {
                      try {
                          sock = new DatagramSocket(); protect(sock); udpRelays.put(key, sock);
                          final DatagramSocket fs = sock; final int fsp = srcPort; final String fdi = dstIP; final int fdp = dstPort;
                          executor.submit(() -> {
                              byte[] rb = new byte[32767];
                              try {
                                  while (!fs.isClosed()) {
                                      DatagramPacket dp = new DatagramPacket(rb, rb.length);
                                      fs.receive(dp);
                                      byte[] resp = buildUDPPacket(dp.getData(), dp.getLength(), dp.getAddress().getHostAddress(), dp.getPort(), "10.88.0.1", fsp);
                                      if (resp != null) { synchronized(tunOut) { tunOut.write(resp); } }
                                  }
                              } catch (Exception e) { Log.v(TAG, "UDP relay receive error: " + e.getMessage()); }
                              finally { udpRelays.remove(key); }
                          });
                      } catch (Exception e) { Log.v(TAG, "UDP socket creation error: " + e.getMessage()); return; }
                  }
                  try { DatagramPacket dp = new DatagramPacket(pkt, payloadOffset, payloadLen, InetAddress.getByName(dstIP), dstPort); sock.send(dp); }
                  catch (Exception e) { Log.v(TAG, "UDP send error: " + e.getMessage()); }
              }

              private byte[] buildTCPPacket(byte[] payload, int pLen, String srcIP, int srcPort, String dstIP, int dstPort, int flags) {
                  try {
                      int tot = 40 + pLen; byte[] p = new byte[tot]; p[0] = 0x45; p[2] = (byte)((tot>>8) & 0xFF); p[3] = (byte)(tot & 0xFF); p[4] = 0; p[5] = 1; p[6] = 0x40; p[8] = 0x40; p[9] = 0x06;
                      fillIP(p,12,srcIP); fillIP(p,16,dstIP); int ck = checksum(p,0,20); p[10] = (byte)((ck>>8) & 0xFF); p[11] = (byte)(ck & 0xFF);
                      p[20] = (byte)((srcPort>>8) & 0xFF); p[21] = (byte)(srcPort & 0xFF); p[22] = (byte)((dstPort>>8) & 0xFF); p[23] = (byte)(dstPort & 0xFF);
                      p[32] = 0x50; p[33] = (byte)(flags & 0xFF); p[34] = (byte)0xFF; p[35] = (byte)0xFF; System.arraycopy(payload,0,p,40,pLen); return p;
                  } catch (Exception e) { Log.e(TAG, "buildTCPPacket error: " + e.getMessage()); return null; }
              }

              private byte[] buildUDPPacket(byte[] payload, int pLen, String srcIP, int srcPort, String dstIP, int dstPort) {
                  try {
                      int tot = 28 + pLen; byte[] p = new byte[tot]; p[0] = 0x45; p[2] = (byte)((tot>>8) & 0xFF); p[3] = (byte)(tot & 0xFF); p[6] = 0x40; p[8] = 0x40; p[9] = 0x11;
                      fillIP(p,12,srcIP); fillIP(p,16,dstIP); int ck = checksum(p,0,20); p[10] = (byte)((ck>>8) & 0xFF); p[11] = (byte)(ck & 0xFF);
                      p[20] = (byte)((srcPort>>8) & 0xFF); p[21] = (byte)(srcPort & 0xFF); p[22] = (byte)((dstPort>>8) & 0xFF); p[23] = (byte)(dstPort & 0xFF);
                      int ul = 8 + pLen; p[24] = (byte)((ul>>8) & 0xFF); p[25] = (byte)(ul & 0xFF); System.arraycopy(payload,0,p,28,pLen); return p;
                  } catch (Exception e) { Log.e(TAG, "buildUDPPacket error: " + e.getMessage()); return null; }
              }

              private void fillIP(byte[] p, int o, String ip) {
                  try { String[] s = ip.split("\\."); p[o] = (byte)Integer.parseInt(s[0]); p[o+1] = (byte)Integer.parseInt(s[1]); p[o+2] = (byte)Integer.parseInt(s[2]); p[o+3] = (byte)Integer.parseInt(s[3]); }
                  catch (Exception e) { Log.e(TAG, "fillIP error: " + e.getMessage()); }
              }

              private int checksum(byte[] buf, int off, int len) {
                  int sum = 0; for (int i=off; i<off+len-1; i+=2) { sum += ((buf[i] & 0xFF) << 8) | (buf[i+1] & 0xFF); }
                  if (len % 2 != 0) { sum += (buf[off+len-1] & 0xFF) << 8; }
                  while ((sum >> 16) != 0) { sum = (sum & 0xFFFF) + (sum >> 16); }
                  return ~sum & 0xFFFF;
              }

              private boolean isPrivate(String ip) {
                  if (ip == null) return true;
                  return ip.startsWith("10.88.") || ip.startsWith("127.") || ip.startsWith("0.") || ip.startsWith("10.") || ip.startsWith("192.168.") || ip.startsWith("169.254.") || ip.startsWith("100.64.") || ip.startsWith("198.18.");
              }

              private void startForegroundNotif() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel chan = new NotificationChannel("spy_vpn", "SPY VPN", NotificationManager.IMPORTANCE_MIN);
                      NotificationManager mgr = getSystemService(NotificationManager.class);
                      if (mgr != null) mgr.createNotificationChannel(chan);
                  }
                  Notification notif = new Notification.Builder(this, "spy_vpn").setContentTitle("SPY Scanner").setContentText("Scanning game traffic...").setSmallIcon(android.R.drawable.ic_menu_manage).build();
                  startForeground(1001, notif);
              }

              private void stopCapture() {
                  running = false; cleanupHandler.removeCallbacks(cleanupTask); closeAll(); stopForeground(STOP_FOREGROUND_REMOVE); stopSelf();
              }

              private void closeAll() {
                  try { if (tun != null) { tun.close(); tun = null; } } catch (Exception ignored) {}
                  for (Socket s : tcpRelays.values()) { try { s.close(); } catch (Exception ignored) {} } tcpRelays.clear();
                  for (DatagramSocket s : udpRelays.values()) { try { s.close(); } catch (Exception ignored) {} } udpRelays.clear();
                  if (executor != null) { executor.shutdownNow(); executor = null; }
              }
          }
